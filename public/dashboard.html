<html lang="en">
<head>

<meta name="theme-color" content="#e6f53a">
<title>Strap – Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="loader.css">

<body class="lock">
<main class="dash" id="dash" hidden></main>
<div class="loader" id="loader" role="status" aria-live="polite" hidden>
  <div class="ld-in">
    <svg class="ld-logo" viewBox="0 0 136 136" aria-hidden="true">
      <circle class="ld-ring" cx="68" cy="68" r="65" fill="none" stroke="#0a0a0a" stroke-width="3" pathLength="1"/>
      <g class="ld-orb"><circle cx="68" cy="3" r="6" fill="#0a0a0a"/></g>
      <circle class="ld-disc" cx="68" cy="68" r="49" fill="#0a0a0a"/>
      <circle class="ld-dot" cx="68" cy="68" r="19" fill="#e6f53a"/>
    </svg>
    <p class="ld-msg" id="loader-msg">Setting up your store</p>
    <div class="ld-bar"><i></i></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="strap-client.js"></script>
<script type="module" src="neon-auth.js"></script>
<script>StrapAPI.boot(['picker.js','ui.js','store.js','kit.js','receipt.js','security.js','products.js','sales.js','settings.js','https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js','features.js','storefront.js','storeshop.js','onlinestore.js','pages.js','dashboard.js']);</script>
</body>
</html>
